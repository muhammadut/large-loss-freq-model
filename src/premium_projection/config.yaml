# =============================================================================
# Premium Projection (Part 2) — config.
# Projects full-year earned premium PER SEGMENT, to multiply by the Part-1 rate.
# =============================================================================

run:
  name: "premium_projection"
  output_dir: "outputs/premium"

data:
  path: "data/basic_data_2.csv"
  premium_col: "TOTAL_EARNED_PREMIUM"
  year_col: "ROLLING_YEAR"
  eff_col: "POLEFFDATE_M"          # policy start date
  exp_col: "POLEXPDATE_M"          # policy end date

segmentation:
  keys: ["CovType", "ratingregion", "MAIN_OPGROUP"]   # same buckets as the rate table
  null_region_key: "ratingregion"
  fill_value: "Unknown"
  # This extract codes ratingregion at province level; the canonical segment uses the
  # 6 grouped rating regions (matches the rate table). Verified by premium-share match.
  region_map:
    AB: ABandT
    NT: ABandT
    YT: ABandT
    NU: ABandT
    BC: BCMS
    MB: BCMS
    SK: BCMS
    NB: Atlantic
    NS: Atlantic
    NL: Atlantic
    PE: Atlantic
    COR: COR
    NEWOR: NEWOR
    QC: QC

calibration:
  experience_years: [2021, 2022, 2023, 2024, 2025]
  clip_max_factor: 5.0            # cap a thin segment's factor (full >= visible, so min is 1.0)
  min_visible_premium: 1000       # below this history, fall back to the portfolio month-factor

backtest:
  holdout_years: [2023, 2024, 2025]   # for each, factors are learned from PRIOR years only
  run_months: [3, 6, 9]               # test running at end of Q1 / H1 / Q3
  within_pct: 10.0

project:                          # the demo projection this run produces
  year: 2025                      # project this year ...
  month: 6                        # ... as if running mid-year (June)

# Optional: multiply the projected premium by the Part-1 rate table to get expected losses
rate_table_glob: "outputs/**/rate_table_final.csv"
