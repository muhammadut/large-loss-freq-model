# =============================================================================
# Premium Projection (Step 2) — DEFAULT config, on the OG data (basic_data_1.csv).
# Both steps run on data_1 so the rate and the premium share ONE extract
# (fully self-consistent expected-loss totals).
#
# data_1 has no POLEFFDATE_M/POLEXPDATE_M; FROM_DT/TO_DT serve as the policy dates
# (validated: ~2.7% backtest WAPE, sane month-by-month growth curve). Regions are
# already the 6 grouped rating regions, so no region_map is needed.
#
# Alternate: config_data2.yaml runs on basic_data_2.csv (true policy dates ->
# slightly tighter ~1.4% WAPE, but a different extract than the rate table).
# =============================================================================

run:
  name: "premium_projection"
  output_dir: "outputs/premium"

data:
  path: "data/basic_data_1.csv"
  premium_col: "TOTAL_EARNED_PREMIUM"
  year_col: "ROLLING_YEAR"
  eff_col: "FROM_DT"               # data_1's policy/coverage start
  exp_col: "TO_DT"                 # data_1's policy/coverage end

segmentation:
  keys: ["CovType", "ratingregion", "MAIN_OPGROUP"]   # same buckets as the rate table
  null_region_key: "ratingregion"
  fill_value: "Unknown"
  # (no region_map — data_1 already uses the 6 grouped rating regions)

calibration:
  experience_years: [2021, 2022, 2023, 2024, 2025]
  clip_max_factor: 5.0
  min_visible_premium: 1000

backtest:
  holdout_years: [2023, 2024, 2025]
  run_months: [3, 6, 9]
  within_pct: 10.0

project:
  year: 2025
  month: 6

rate_table_glob: "outputs/**/rate_table_final.csv"   # pairs with the latest Part-1 run
