# =============================================================================
# TIV-lens variant of the calibration config.
# Identical to config.yaml EXCEPT the exposure lens (TIV instead of premium) and
# the output directory. This is the "asset-value" hazard lens — a deliberately
# different view from premium (see config.reference.md and the docs).
# Run:  python src/run.py --config src/config/config_tiv.yaml
# =============================================================================

run:
  name: "annual_recalibration_2025_TIV"
  output_dir: "outputs/tiv"

data:
  path: "data/basic_data_1.csv"
  loss_col: "TOTAL_COVERAGE_INCURREDLOSS_M"
  year_col: "ROLLING_YEAR"
  cat_flag_col: "CATASTROPHENUMBER"
  policy_period_col: "POLICYPERIOD_ID_M"

large_loss:
  threshold: 200000
  mode: "fixed"
  cat_scope: "assume_excluded"

exposure:
  lens: "tiv"                          # <-- the only substantive change vs config.yaml
  columns:
    premium: "TOTAL_EARNED_PREMIUM"
    tiv: "TIV"
    earned_exposure: "TOTAL_EARNED_EXPOSURE"

segmentation:
  keys: ["CovType", "ratingregion", "MAIN_OPGROUP"]
  industry_key: "MAIN_OPGROUP"
  null_region_key: "ratingregion"
  null_region_fill: "Unknown"
  drop_null_industry: true

calibration:
  experience_years: [2021, 2022, 2023, 2024, 2025]
  reference_year: 2024
  family: "poisson"
  year_effect: true

credibility:
  method: "buhlmann_hierarchical"
  level1_keys: ["CovType", "MAIN_OPGROUP"]
  full_credibility_losses: 5

validation:
  reconciliation:      {tol_pct: 1.0,  on_fail: "halt"}
  dispersion:          {max_ratio: 1.5, on_fail: "warn"}
  thin_segment_share:  {max_thin_pct: 90, on_fail: "warn"}
  backtest:            {holdout_year: 2024, on_fail: "warn"}
  backtest_segment:    {min_spearman: 0.45, on_fail: "warn"}
  robustness_drop_yr:  {max_p95_move_pct: 40, on_fail: "warn"}
  base_agreement:      {alt_lens: "premium", min_corr: 0.80, on_fail: "warn"}   # compare back to premium
  total_preservation:  {max_drift_pct: 2.0, on_fail: "warn"}
